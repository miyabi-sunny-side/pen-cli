[package]
name = "pen-cli"
version = "0.1.6"
edition = "2024"
rust-version = "1.96"
description = "Suspend and restore herdr workspaces"
repository = "https://github.com/miyabi-sunny-side/pen-cli"
license = "MIT"
publish = false

[[bin]]
name = "pen"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

[dev-dependencies]
serde_yaml = "0.9.34"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
