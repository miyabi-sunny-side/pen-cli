[package]
name = "pen-cli"
version = "0.1.14"
edition = "2024"
rust-version = "1.96"
description = "Suspend and restore herdr workspaces"
repository = "https://github.com/miyabi-sunny-side/pen-cli"
license = "MIT"
publish = false

[[bin]]
name = "pen"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

[dev-dependencies]
serde_yaml = "0.9.34"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
missing_assert_message = "warn"

[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 16
